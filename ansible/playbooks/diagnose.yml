---
# 착수보고서 "취약점 진단 자동화 흐름" 5단계 중 3~5단계를 담당하는 플레이북.
#   3) OS 자동 식별 (gather_facts)
#   4) SSH 병렬 실행 (become: yes, forks는 ansible.cfg 또는 실행 시 -f 옵션으로 지정)
#   5) JSON 결과 회수 (fetch) 후 원격 흔적 삭제
#
# 대시보드(blueprints/diagnosis.py)가 다음 방식으로 이 플레이북을 호출한다:
#   ansible_runner.run(
#       playbook="playbooks/diagnose.yml",
#       inventory=<generate_inventory()가 만든 경로>,
#       limit="rocky01,ubuntu01,...",   # 사용자가 대시보드에서 선택한 서버만
#   )
#
# scripts/{{ os_family }}/run_all.sh 는 각 팀원이 개발 중인
# u_XX_acc_check.sh / file_check.sh / ser_check.sh / pat_check.sh / log_check.sh
# 를 순서대로 실행하고, 그 결과를 11개 필드 표준 JSON 배열로 합쳐
# stdout으로 출력하는 "묶음 실행 스크립트"라고 가정한다. (아직 없다면 아래
# "run_all.sh 계약" 섹션 참고해서 만들면 됨)

- name: KISA 취약점 진단 스크립트 실행 및 결과 회수
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: yes
  become: "{{ ansible_become | default(true) }}"

  vars:
    remote_work_dir: /tmp/security_check
    # os_family는 인벤토리 그룹명과 동일하게 맞춘다 (rocky_linux / ubuntu)
    os_group: "{{ group_names[0] }}"
    # scripts/ 전체(모든 OS 폴더 + common/)를 그대로 복사해서 로컬과 동일한 상대
    # 경로 구조(<os_group>/account/../../common/json_output.sh)를 원격에서도 유지한다.
    # os_group 폴더만 복사하면 account 스크립트가 source하는 common/이 빠져 실패한다.
    local_scripts_root: "{{ playbook_dir }}/../scripts"
    local_result_dir: "{{ playbook_dir }}/../../scan_results"

  tasks:
    - name: 원격 작업 디렉터리 생성
      file:
        path: "{{ remote_work_dir }}"
        state: directory
        mode: "0700"

    - name: 점검 스크립트 전체(공통 라이브러리 포함) 복사
      copy:
        src: "{{ local_scripts_root }}/"
        dest: "{{ remote_work_dir }}/"
        mode: "0700"

    - name: 점검 스크립트 일괄 실행 (표준 JSON 출력)
      shell: "./run_all.sh > result.json"
      args:
        chdir: "{{ remote_work_dir }}/{{ os_group }}"
        executable: /bin/bash

    - name: 결과 JSON 회수 (컨트롤 노드로)
      fetch:
        src: "{{ remote_work_dir }}/{{ os_group }}/result.json"
        dest: "{{ local_result_dir }}/{{ inventory_hostname }}.json"
        flat: yes

    - name: 원격 작업 디렉터리 삭제 (흔적 미잔존)
      file:
        path: "{{ remote_work_dir }}"
        state: absent

# ---------------------------------------------------------------------------
# run_all.sh 계약 (팀원이 개발 중인 스크립트가 지켜야 할 출력 형식)
# ---------------------------------------------------------------------------
# 이 플레이북은 run_all.sh가 아래와 같은 JSON "배열"을 stdout으로 출력한다고
# 가정한다. 항목당 11개 필드(check_id~checked_at)는 models.py의 ScanResult와
# 1:1로 대응한다. checked_at, server_id는 대시보드 쪽에서 채워주므로 생략 가능.
#
# [
#   {
#     "check_id": "U-01",
#     "category": "계정 관리",
#     "item_name": "root 계정 원격 접속 제한",
#     "risk_level": "H",
#     "os_scope": "unix",
#     "result": "취약",
#     "current_setting": "PermitRootLogin 값이 yes로 설정되어 있음",
#     "recommendation": "PermitRootLogin no로 설정 후 sshd 재시작",
#     "score": 10
#   },
#   ...
# ]
#
# check_id는 catalog.py의 CheckItem.code와 정확히 일치해야 대시보드가
# 매핑할 수 있다 (U-01 ~ U-47, WEB-CI ~ WEB-WM).
